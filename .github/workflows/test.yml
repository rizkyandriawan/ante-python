name: Test
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install . coverage ruff pika
      - run: coverage run --source=ante -m unittest discover -s tests -v
      - run: coverage report --fail-under=85
      - run: ruff check src tests
      - run: ruff format --check src tests
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --release --workspace -- -D warnings
      - run: cargo test --release --workspace --exclude ante-python
