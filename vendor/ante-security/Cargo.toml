[package]
name = "ante-security"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
rustls = "0.23"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tokio-rustls = "0.26"
