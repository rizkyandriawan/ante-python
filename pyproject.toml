[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "ante-embedded"
version = "0.1.0"
description = "In-process durable Rust work queue for Python, powered by PyO3"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Rizky Andriawan" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]

[tool.maturin]
python-source = "src"
module-name = "ante._native"

[tool.unittest]
start-directory = "tests"

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
