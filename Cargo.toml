[package]
name = "ante-python"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]
members = ["vendor/ante-core", "vendor/ante-amqp", "vendor/ante-security"]

[lib]
name = "_native"
path = "rust/lib.rs"
crate-type = ["cdylib"]

[dependencies]
ante-core = { path = "vendor/ante-core" }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
ante-amqp = { path = "vendor/ante-amqp" }
ante-security = { path = "vendor/ante-security" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
